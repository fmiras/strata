[package]
name = "strata"
version = "0.1.0"
edition = "2024"

[dependencies]
# The core primitives (Transactions, Scripts, etc.)
bitcoin = { version = "0.32", features = ["rand", "serde"] }
# For the BIP-39 Mnemonic logic
bip39 = "2.0.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
keyring = { version = "3.6.3", features = ["apple-native"] }
security-framework = "2.11"
